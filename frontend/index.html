<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoWeather - Previsão</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="icon"
      href="https://img.icons8.com/fluency/96/000000/partly-cloudy-day.png"
      type="image/png"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="particles-js"></div>
    <div class="glow"></div>
    <div class="glow"></div>
    <div class="scanlines"></div>

    <!-- CONTAINER PRINCIPAL -->
    <div class="container">
      <!-- HEADER -->
      <header class="site-header">
        <div class="logo">NeoWeather</div>
        <div class="date" id="current-date"></div>
      </header>

      <!-- CONTEÚDO PRINCIPAL -->
      <main>
        <!-- SEARCH -->
        <section class="search-container">
          <input
            type="text"
            class="search-input"
            id="city-input"
            placeholder="Digite o nome da cidade..."
            autocomplete="off"
          />

          <button class="search-btn" id="search-btn">
            <i class="fas fa-search"></i>
          </button>
        </section>

        <!-- WEATHER -->
        <section class="weather-display" id="weather-display">
          <div class="loading" id="loading">
            <div class="loading-spinner"></div>
          </div>
        </section>
      </main>
    </div>

    <!-- CARD FLUTUANTE DE REDES SOCIAIS -->
    <aside class="social-float">
      <a
        href="https://github.com/Lucas-tech-silva"
        target="_blank"
        data-tooltip="GitHub"
      >
        <i class="fab fa-github"></i>
      </a>

      <a
        href="https://www.linkedin.com/in/lucassilva-developer"
        target="_blank"
        data-tooltip="LinkedIn"
      >
        <i class="fab fa-linkedin"></i>
      </a>

      <a
        href="https://wa.me/5511995442274?text=Olá%20Lucas!%20Tudo%20bem%3F%20Vi%20o%20projeto%20NeoWeather%20e%20gostei%20muito%20do%20visual%20e%20da%20ideia.%20Gostaria%20de%20conversar%20sobre%20uma%20possível%20colaboração%20ou%20oportunidade%20profissional."
        target="_blank"
        data-tooltip="WhatsApp"
      >
        <i class="fab fa-whatsapp"></i>
      </a>
    </aside>

    <!-- FOOTER -->
    <footer>
      <p>© 2026 NeoWeather • <span>Desenvolvido por Lucas Silva</span> 🚀</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script src="js/script.js" defer></script>
  </body>
</html>
